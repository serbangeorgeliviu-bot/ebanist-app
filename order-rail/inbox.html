<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E3B2A">
<title>Ebanist — inbox</title>
<link rel="icon" href="/app/icons/favicon.ico" sizes="any">
<style>
:root{--ink:#12160f;--muted:#4d5647;--faint:#7b8474;--bg:#faf9f5;--card:#fff;--line:#e2e6dc;
  --green:#0E3B2A;--gold:#D4AF37;--warn:#b0651a;
  --disp:'Barlow Condensed',Arial Narrow,sans-serif;--body:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root{--ink:#eef0ea;--muted:#b3bcac;--faint:#8d9686;--bg:#12160f;--card:#1a1f17;--line:#2c3327}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);background:var(--bg);color:var(--ink);line-height:1.45;font-size:15px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header{background:var(--green);color:#fff;padding:14px 0}
header .wrap{display:flex;align-items:center;gap:12px}
header h1{font-family:var(--disp);font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:1px}
header .sub{margin-left:auto;font-size:13px;opacity:.85}
main{padding:22px 0 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--faint);margin-bottom:5px}
input{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;background:var(--bg);
  color:var(--ink);font:inherit;font-size:17px}
button{font:inherit;font-weight:600;padding:13px 18px;border:1px solid transparent;border-radius:10px;cursor:pointer;min-height:48px}
.btn-p{background:var(--green);color:#fff;width:100%}
.btn-s{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn-sm{padding:8px 12px;min-height:0;font-size:13px}
.msg{margin-top:10px;font-size:14px;min-height:1.2em}
.msg.err{color:#b3261e}
.warnbar{background:#fff3cd;border:1px solid var(--gold);color:#5a4405;border-radius:10px;
  padding:10px 12px;font-size:13.5px;margin-bottom:14px;line-height:1.4}
.ord{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.ord .top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ord .id{font-family:var(--disp);font-size:19px;font-weight:700;letter-spacing:.6px}
.ord .amt{margin-left:auto;font-family:var(--disp);font-size:19px;font-weight:700;white-space:nowrap}
.ord .who{font-size:14px;color:var(--muted);margin-top:2px}
.ord .meta{font-size:12.5px;color:var(--faint);margin-top:4px;word-break:break-all}
.ord .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pill{display:inline-block;font-size:11px;text-transform:uppercase;letter-spacing:.7px;font-weight:700;
  padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.pill.received{border-color:var(--gold);color:#8a6d10}
.pill.confirmed{border-color:var(--green);color:var(--green)}
.pill.cut{border-color:#2f6fb0;color:#2f6fb0}
.pill.collected{border-color:var(--faint);color:var(--faint)}
@media (prefers-color-scheme:dark){.pill.confirmed{color:#8fd0ae;border-color:#8fd0ae}}
.v2{font-size:11px;font-weight:700;color:var(--warn);border:1px solid var(--warn);border-radius:999px;padding:2px 8px}
.empty{color:var(--faint);text-align:center;padding:36px 0}
a{color:var(--green)}
@media (prefers-color-scheme:dark){a{color:#8fd0ae}}
[hidden]{display:none!important}
</style>
</head>
<body>

<header><div class="wrap">
  <h1 id="atName">Ebanist</h1>
  <span class="sub" id="atSub">inbox</span>
</div></header>

<main class="wrap">
  <div id="gate" class="card">
    <label id="lPin">PIN</label>
    <input id="pin" type="tel" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="••••">
    <button class="btn-p" id="go" style="margin-top:12px">—</button>
    <p class="msg" id="msg"></p>
  </div>

  <div id="list" hidden>
    <div class="warnbar" id="insecure" hidden></div>
    <div id="orders"></div>
  </div>
</main>

<script src="/order-rail/i18n.js"></script>
<script>
"use strict";
/* Slug-ul din cale: /a/<slug>/inbox. Pagina e servită prin rescriere 200,
   deci calea rămâne cea frumoasă și e singura sursă. */
var SLUG = (location.pathname.match(/^\/a\/([a-z0-9][a-z0-9-]{0,40})\//) || [])[1] || "";
var CFG = null, T = ORI18N.pick("ro"), PIN = "";

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

function money(n, cur){
  try{ return new Intl.NumberFormat(T._locale,{style:"currency",currency:cur||"EUR"}).format(n); }
  catch(e){ return (Math.round(n*100)/100).toFixed(2)+" "+(cur||"EUR"); }
}
function when(iso){
  try{ return new Date(iso).toLocaleString(T._locale); }catch(e){ return iso||""; }
}

function paintStatic(){
  $("lPin").textContent = T.pin;
  $("go").textContent = T.enter;
  $("atSub").textContent = T.inbox;
}

fetch("/ateliers/"+SLUG+".json").then(function(r){ return r.ok?r.json():null; }).then(function(c){
  CFG = c;
  if(c){
    T = ORI18N.pick(c.language||"ro");
    $("atName").textContent = c.name;
    document.title = c.name + " — " + T.inbox;
    document.documentElement.lang = c.language || "ro";
  }
  paintStatic();
}).catch(function(){ paintStatic(); });

$("go").addEventListener("click", load);
$("pin").addEventListener("keydown", function(e){ if(e.key==="Enter") load(); });

function load(){
  var pin = $("pin").value.trim();
  if(!pin){ $("pin").focus(); return; }
  var b = $("go"); b.disabled = true; var old = b.textContent; b.textContent = "…";
  $("msg").className = "msg"; $("msg").textContent = "";
  fetch("/api/orders?atelier="+encodeURIComponent(SLUG), { headers:{ "x-inbox-pin": pin } })
    .then(function(r){ return r.json().then(function(j){ return {s:r.status,j:j}; }); })
    .then(function(res){
      b.disabled = false; b.textContent = old;
      if(res.s === 401){ $("msg").className="msg err"; $("msg").textContent = T.badPin; return; }
      if(res.s === 503){ $("msg").className="msg err"; $("msg").textContent = T.noServer; return; }
      if(res.s !== 200){ $("msg").className="msg err"; $("msg").textContent = res.j.error||("HTTP "+res.s); return; }
      PIN = pin;
      $("gate").hidden = true; $("list").hidden = false;
      if(res.j.insecure){
        $("insecure").hidden = false;
        $("insecure").textContent = T.insecure;
      }
      render(res.j.orders||[]);
    })
    .catch(function(){ b.disabled=false; b.textContent=old;
      $("msg").className="msg err"; $("msg").textContent = T.noServer; });
}

var FLOW = ["received","confirmed","cut","collected"];

function render(list){
  var box = $("orders");
  if(!list.length){ box.innerHTML = '<p class="empty">'+esc(T.empty)+'</p>'; return; }
  var h = "";
  for(var i=0;i<list.length;i++){
    var o = list[i];
    var next = FLOW[FLOW.indexOf(o.status)+1];
    h += '<div class="ord" data-id="'+esc(o.id)+'">'+
      '<div class="top"><span class="id">'+esc(o.id)+'</span>'+
      (o.version>1 ? '<span class="v2">v'+o.version+'</span>' : '')+
      '<span class="pill '+esc(o.status)+'">'+esc(T.status[o.status]||o.status)+'</span>'+
      '<span class="amt">'+esc(o.price?money(o.price.total,o.price.currency):"—")+'</span></div>'+
      '<div class="who">'+esc(o.customer.name)+' · <a href="tel:'+esc(o.customer.phone)+'">'+esc(o.customer.phone)+'</a></div>'+
      '<div class="meta">'+esc(when(o.created_at))+' · '+o.pieces+' '+esc(T.pieces)+
        (o.confirmed_at ? ' · '+esc(T.frozenAt)+' '+esc(when(o.confirmed_at)) : '')+
        '<br>'+esc(T.hash)+': '+esc(String(o.hash||"").slice(0,16))+'…</div>'+
      '<div class="acts">'+
        '<a class="btn-s btn-sm" style="display:inline-block;text-decoration:none;line-height:1.6" href="/a/'+esc(SLUG)+'/order/'+esc(o.id)+'">'+esc(T.open)+'</a>'+
        (o.confirmed_at ? '' :
          '<button class="btn-s btn-sm" data-act="confirm" data-id="'+esc(o.id)+'">'+esc(T.confirm)+'</button>')+
        (next ? '<button class="btn-s btn-sm" data-act="status" data-next="'+esc(next)+'" data-id="'+esc(o.id)+'">'+
                esc(T.markAs.replace("{s}", T.status[next]))+'</button>' : '')+
      '</div></div>';
  }
  box.innerHTML = h;
  var btns = box.querySelectorAll("button[data-act]");
  for(var k=0;k<btns.length;k++) btns[k].addEventListener("click", act);
}

function act(e){
  var b = e.currentTarget, id = b.getAttribute("data-id"), a = b.getAttribute("data-act");
  /* Confirmarea îngheață snapshot-ul. Se cere o dată, explicit: după ea
     comanda nu se mai poate schimba, iar în atelier poate fi deja tăiată. */
  if(a === "confirm" && !confirm(T.confirmAsk.replace("{id}", id))) return;
  b.disabled = true;
  var body = a === "confirm" ? { atelier: SLUG } : { atelier: SLUG, status: b.getAttribute("data-next") };
  fetch("/api/orders/"+encodeURIComponent(id)+"/"+a, {
    method: "POST",
    headers: { "Content-Type":"application/json", "x-inbox-pin": PIN },
    body: JSON.stringify(body)
  }).then(function(r){ return r.json(); })
    .then(function(){
      /* Confirmarea e ultimul pas al pâlniei și se măsoară de aici: e
         singurul loc unde se întâmplă. Fără el, rata de conversie s-ar
         opri la „trimisă" și n-am ști câte comenzi ajung efectiv la
         debitat. */
      if(a === "confirm"){
        try{
          fetch("/api/stats", { method:"POST", headers:{"Content-Type":"application/json"},
            body: JSON.stringify({ e:"order_confirmed", a:SLUG, s:"inbox" }) }).catch(function(){});
        }catch(e){}
      }
      load2();
    })
    .catch(function(){ b.disabled = false; });
}
function load2(){
  fetch("/api/orders?atelier="+encodeURIComponent(SLUG), { headers:{ "x-inbox-pin": PIN } })
    .then(function(r){ return r.json(); })
    .then(function(j){ render(j.orders||[]); })
    .catch(function(){});
}
</script>
</body>
</html>
