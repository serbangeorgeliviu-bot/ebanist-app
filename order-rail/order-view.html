<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E3B2A">
<title>Ebanist — comandă</title>
<link rel="icon" href="/app/icons/favicon.ico" sizes="any">
<style>
:root{--ink:#12160f;--muted:#4d5647;--faint:#7b8474;--bg:#faf9f5;--card:#fff;--line:#e2e6dc;
  --green:#0E3B2A;--gold:#D4AF37;
  --disp:'Barlow Condensed',Arial Narrow,sans-serif;--body:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root{--ink:#eef0ea;--muted:#b3bcac;--faint:#8d9686;--bg:#12160f;--card:#1a1f17;--line:#2c3327}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);background:var(--bg);color:var(--ink);line-height:1.45;font-size:15px}
.wrap{max-width:700px;margin:0 auto;padding:0 16px}
header{background:var(--green);color:#fff;padding:14px 0}
header .wrap{display:flex;align-items:center;gap:12px}
header h1{font-family:var(--disp);font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:1px}
main{padding:22px 0 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.id{font-family:var(--disp);font-size:30px;font-weight:700;letter-spacing:1px;line-height:1}
.amt{font-family:var(--disp);font-size:26px;font-weight:700}
.k{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--faint);margin-top:12px}
.v{font-size:16px}
.pill{display:inline-block;font-size:11px;text-transform:uppercase;letter-spacing:.7px;font-weight:700;
  padding:3px 9px;border-radius:999px;border:1px solid var(--gold);color:#8a6d10}
.pill.confirmed{border-color:var(--green);color:var(--green)}
@media (prefers-color-scheme:dark){.pill.confirmed{color:#8fd0ae;border-color:#8fd0ae}}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
td{padding:4px 0}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.sum td{border-top:1px solid var(--line);font-weight:700;padding-top:7px}
.dl{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.dl a,.dl button{font:inherit;font-weight:600;font-size:14px;padding:11px 14px;border-radius:10px;
  border:1px solid var(--line);background:var(--bg);color:var(--ink);text-decoration:none;cursor:pointer}
.dl .p{background:var(--green);color:#fff;border-color:var(--green)}
.hint{font-size:13px;color:var(--faint);margin-top:8px}
.hash{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;word-break:break-all;color:var(--muted)}
.empty{color:var(--faint);text-align:center;padding:40px 0}
</style>
</head>
<body>

<header><div class="wrap"><h1 id="atName">Ebanist</h1></div></header>
<main class="wrap"><div id="body"><p class="empty">…</p></div></main>

<script src="/order-rail/i18n.js"></script>
<script src="/order-rail/order-view.js"></script>
</body>
</html>
