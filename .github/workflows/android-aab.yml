# Ebanist — construiește .aab-ul semnat pentru Google Play și APK-ul
# semnat cu aceeași cheie, de instalat direct pe telefon.
#
# Se pornește de mână: GitHub → Actions → „android-aab” → Run workflow.
# La final, în secțiunea „Artifacts” a rulării:
#   ebanist-aab  → Play Console → Testare închisă → Creează o lansare nouă;
#   ebanist-apk  → se descarcă pe telefon și se instalează peste APK-ul
#                  vechi, dacă acela e semnat cu aceeași cheie de upload.
#
# Cheia de upload NU stă în repo. Vine din patru secrete ale repo-ului
# (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_B64       fișierul signing.keystore, codificat base64
#   ANDROID_KEYSTORE_PASSWORD  parola keystore-ului
#   ANDROID_KEY_ALIAS          aliasul cheii (la PWABuilder: my-key-alias)
#   ANDROID_KEY_PASSWORD       parola cheii
# Fără ele, lucrarea se oprește cu un mesaj clar, nu cu un .aab nesemnat
# pe care Play l-ar refuza oricum.
#
# UPLOAD ÎN GOOGLE PLAY (opțional). La „Run workflow" alegi `track`:
#   none        (implicit) numai construiește, ca până acum;
#   internal / alpha (testare închisă) / beta / production
#               după construire, urcă .aab-ul în Play prin API
#               (android/tools/play-upload.mjs, fără acțiuni terțe).
# `status` = draft (implicit: apare în Play Console ca ciornă, nu pleacă la
# nimeni până nu o trimiți tu) sau completed. production + completed pleacă
# la toți utilizatorii și cere `confirm` = da.
# Mai cere un secret al repo-ului:
#   PLAY_SERVICE_ACCOUNT_JSON  cheia JSON a contului de serviciu din Google
#                              Cloud, invitat în Play Console cu drept de
#                              gestionare a lansărilor. Nu intră în repo.
# Doar .aab-ul: formularul „Data safety", abonamentele și pagina aplicației
# nu se ating de aici.

name: android-aab

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Urcă în Google Play pe acest track (none = doar construiește)"
        type: choice
        options: [none, internal, alpha, beta, production]
        default: none
      status:
        description: "draft = ciornă în Play Console; completed = lansează pe track"
        type: choice
        options: [draft, completed]
        default: draft
      notes:
        description: "Note de lansare, ro-RO, max 500 de caractere (opțional)"
        type: string
        default: ""
      confirm:
        description: "Scrie «da» pentru production + completed (pleacă la toți utilizatorii)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Cheia de upload
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # ANDROID_KEYSTORE_B64 poate fi:
          #  - signing.keystore în base64 (parolele vin din celelalte trei secrete), sau
          #  - un tar cu signing.keystore + signing-key-info.txt de la PWABuilder,
          #    în base64; atunci parolele și aliasul se citesc din fișier, iar
          #    celelalte trei secrete nu mai sunt necesare. Făcut în Termux cu:
          #      tar c signing.keystore signing-key-info.txt | base64 -w0
          if [ -z "$KS_B64" ]; then
            echo "::error::Lipsește secretul ANDROID_KEYSTORE_B64."
            exit 1
          fi
          trim() { printf '%s' "$1" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          D="$RUNNER_TEMP/cheie"; mkdir -p "$D"
          printf '%s' "$KS_B64" | tr -d ' \r\n' | base64 -d > "$D/blob"
          if tar tf "$D/blob" >/dev/null 2>&1; then
            tar xf "$D/blob" -C "$D"
            KS_FILE=$(find "$D" -name signing.keystore | head -1)
            INFO=$(find "$D" -name 'signing-key-info*.txt' | head -1)
            [ -n "$KS_FILE" ] && [ -n "$INFO" ] || { echo "::error::Arhiva nu conține signing.keystore și signing-key-info.txt."; exit 1; }
            camp() { grep -i "^$1:" "$INFO" | head -1 | sed 's/^[^:]*:[[:space:]]*//'; }
            KS_PASS=$(camp 'Key store password'); KEY_ALIAS=$(camp 'Key alias'); KEY_PASS=$(camp 'Key password')
            echo "Cheia și parolele vin din signing-key-info.txt."
          else
            KS_FILE="$D/blob"
          fi
          KS_PASS=$(trim "$KS_PASS"); KEY_ALIAS=$(trim "$KEY_ALIAS"); KEY_PASS=$(trim "$KEY_PASS")
          # Citite din fișier, nu din secrete: GitHub nu le ascunde singur în jurnal.
          echo "::add-mask::$KS_PASS"; echo "::add-mask::$KEY_PASS"
          if [ -z "$KS_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Lipsesc parola, aliasul sau parola cheii (secretele ANDROID_* sau signing-key-info.txt)."
            exit 1
          fi
          cp "$KS_FILE" "$RUNNER_TEMP/upload.keystore"
          {
            echo "storeFile=$RUNNER_TEMP/upload.keystore"
            echo "storePassword=$KS_PASS"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > android/keystore.properties
          rm -rf "$D"

      - name: Cheia e cea înregistrată la Play?
        run: |
          # Amprenta cheii de upload, aceeași ca în /.well-known/assetlinks.json.
          # Pe telefon au rămas mai multe signing.keystore din încercările
          # PWABuilder; doar aceasta e acceptată de Play.
          ASTEPTAT="30:25:FE:93:6C:A9:68:6A:45:CA:91:7E:18:0E:2A:2D:27:D5:6A:BB:1E:01:42:99:8C:D0:E2:CC:91:EA:BF:1E"
          # Parola și aliasul, așa cum le-a pregătit pasul de mai sus.
          KS_PASS=$(grep '^storePassword=' android/keystore.properties | cut -d= -f2-)
          KEY_ALIAS=$(grep '^keyAlias=' android/keystore.properties | cut -d= -f2-)
          # signing.keystore de la PWABuilder are 2756 de octeți; altă mărime
          # înseamnă că textul base64 s-a copiat incomplet.
          echo "Mărimea cheii decodate: $(stat -c %s "$RUNNER_TEMP/upload.keystore") octeți"
          OUT=$(keytool -list -v -keystore "$RUNNER_TEMP/upload.keystore" -storepass "$KS_PASS" -alias "$KEY_ALIAS" 2>&1 || true)
          GASIT=$(echo "$OUT" | grep -m1 "SHA256:" | awk '{print $2}')
          if [ -z "$GASIT" ]; then
            # Mesajul keytool (parolă greșită, alias inexistent, format invalid) — fără secrete.
            echo "$OUT" | grep -iE "error|exception|alias|password|format" | head -3
            echo "::error::Cheia nu s-a putut deschide: vezi mesajul keytool de mai sus."
            exit 1
          fi
          echo "Amprenta cheii: $GASIT"
          if [ "$GASIT" != "$ASTEPTAT" ]; then
            echo "::error::Cheia din ANDROID_KEYSTORE_B64 nu e cheia de upload a aplicației (aștept $ASTEPTAT). Alt signing.keystore."
            exit 1
          fi

      - name: bundleRelease + assembleRelease
        working-directory: android
        run: gradle --no-daemon bundleRelease assembleRelease

      - name: Verifică semnătura
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify "$AAB" | tail -1
          keytool -printcert -jarfile "$AAB" | grep -m1 "SHA256:"
          ls -l android/app/build/outputs/apk/release/

      - uses: actions/upload-artifact@v4
        with:
          name: ebanist-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: ebanist-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Urcă în Google Play
        if: ${{ inputs.track != 'none' }}
        env:
          SA_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_TRACK: ${{ inputs.track }}
          PLAY_STATUS: ${{ inputs.status }}
          PLAY_NOTES: ${{ inputs.notes }}
          PLAY_CONFIRM: ${{ inputs.confirm }}
        run: |
          # Valorile intrărilor vin prin mediu, nu lipite în script (nicio injecție).
          if [ -z "$SA_JSON" ]; then
            echo "::error::Lipsește secretul PLAY_SERVICE_ACCOUNT_JSON (cheia JSON a contului de serviciu din Google Cloud)."
            exit 1
          fi
          umask 077
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/play-sa.json"
          PLAY_SA_FILE="$RUNNER_TEMP/play-sa.json" \
            node android/tools/play-upload.mjs android/app/build/outputs/bundle/release/app-release.aab

      - name: Șterge cheia
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore" "$RUNNER_TEMP/play-sa.json" android/keystore.properties
