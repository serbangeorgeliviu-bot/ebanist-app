# Ebanist — construiește .aab-ul semnat pentru Google Play.
#
# Se pornește de mână: GitHub → Actions → „android-aab” → Run workflow.
# La final, .aab-ul e în secțiunea „Artifacts” a rulării, gata de încărcat
# în Play Console → Testare închisă → Creează o lansare nouă.
#
# Cheia de upload NU stă în repo. Vine din patru secrete ale repo-ului
# (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_B64       fișierul signing.keystore, codificat base64
#   ANDROID_KEYSTORE_PASSWORD  parola keystore-ului
#   ANDROID_KEY_ALIAS          aliasul cheii (la PWABuilder: my-key-alias)
#   ANDROID_KEY_PASSWORD       parola cheii
# Fără ele, lucrarea se oprește cu un mesaj clar, nu cu un .aab nesemnat
# pe care Play l-ar refuza oricum.

name: android-aab

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Cheia de upload
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Lipsesc secretele ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          {
            echo "storeFile=$RUNNER_TEMP/upload.keystore"
            echo "storePassword=$KS_PASS"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > android/keystore.properties

      - name: bundleRelease
        working-directory: android
        run: gradle --no-daemon bundleRelease

      - name: Verifică semnătura
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify "$AAB" | tail -1
          keytool -printcert -jarfile "$AAB" | grep -m1 "SHA256:"

      - uses: actions/upload-artifact@v4
        with:
          name: ebanist-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Șterge cheia
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore" android/keystore.properties
