<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E3B2A">
<title>Ebanist — de la măsurători la lista de debitare</title>
<meta name="description" content="Aplicație de proiectare mobilier pentru tâmplari: corpuri parametrice, listă de debitare, etichete, fișă de asamblare, deviz. Gratuit pentru 2 proiecte.">
<link rel="icon" href="/app/icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/app/icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/app/icons/apple-touch-icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Nessun cookie, nessun tracciatore, nessun banner da chiudere.
     Se un giorno servissero i numeri delle visite, si accende UNA riga qui
     sotto: GoatCounter non usa cookie e non fa profilazione, quindi non fa
     comparire nessun banner. Resta commentata finche non serve davvero.
<script data-goatcounter="https://ebanist.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
-->
<style>
:root{
  --ink:#12160f; --muted:#4d5647; --faint:#7b8474;
  --bg:#faf9f5; --card:#ffffff; --line:#e2e6dc;
  --green:#0E3B2A; --green-soft:#16513a; --gold:#D4AF37;
  --disp:'Barlow Condensed',Arial Narrow,sans-serif;
  --body:'Barlow',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--ink:#eef0ea; --muted:#b3bcac; --faint:#8d9686;
        --bg:#12160f; --card:#1a1f17; --line:#2c3327;}
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--body);background:var(--bg);color:var(--ink);line-height:1.5;
  font-size:16px;-webkit-font-smoothing:antialiased}
.wrap{max-width:880px;margin:0 auto;padding:0 20px}

/* ---------- barra ---------- */
header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;height:58px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--disp);font-size:22px;
  font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--green);text-decoration:none}
@media (prefers-color-scheme:dark){.brand{color:#8fd0ae}}
.brand img{width:26px;height:26px;display:block}
.bar .sp{flex:1}
/* Il selettore di lingua e QUATTRO bottoni, non un menu a tendina: si vede
   subito che l'app parla la tua lingua, e si cambia con un dito solo. */
.langs{display:flex;gap:2px}
.langs button{font:600 12px/1 var(--body);letter-spacing:.6px;text-transform:uppercase;
  background:none;border:1px solid transparent;color:var(--faint);padding:6px 7px;
  border-radius:7px;cursor:pointer}
.langs button.on{color:var(--green);border-color:var(--line);background:var(--card)}
@media (prefers-color-scheme:dark){.langs button.on{color:#8fd0ae}}

/* ---------- schermata unica ---------- */
main{padding:46px 0 20px}
h1{font-family:var(--disp);font-size:clamp(34px,7vw,54px);line-height:1.04;font-weight:700;
  text-transform:uppercase;letter-spacing:.5px;max-width:16ch}
.lede{margin-top:16px;font-size:clamp(17px,2.4vw,20px);color:var(--muted);max-width:52ch}

.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font:600 16px/1 var(--body);padding:15px 24px;border-radius:12px;border:1px solid transparent;
  text-decoration:none;cursor:pointer;min-height:52px}
.btn-p{background:var(--green);color:#fff}
.btn-p:hover{background:var(--green-soft)}
.btn-s{background:var(--card);color:var(--ink);border-color:var(--line)}
.note{margin-top:12px;font-size:14px;color:var(--faint)}

/* ---------- i tre vantaggi ---------- */
.bens{display:grid;gap:14px;margin-top:40px}
@media (min-width:700px){.bens{grid-template-columns:repeat(3,1fr)}}
.ben{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.ben h3{font-family:var(--disp);font-size:19px;font-weight:700;text-transform:uppercase;
  letter-spacing:.5px;margin-bottom:6px}
.ben p{font-size:15px;color:var(--muted)}
.ben .n{font-family:var(--disp);font-size:13px;font-weight:700;color:var(--gold);
  letter-spacing:1.4px;display:block;margin-bottom:8px}

/* ---------- il filmato ----------
   Segnaposto dichiarato: meglio un rettangolo che dice «qui va il video»
   che un video finto o un'immagine di repertorio che non e l'app. */
.demo{margin-top:36px;border:1px solid var(--line);border-radius:14px;overflow:hidden;
  background:var(--card)}
.demo .ph{aspect-ratio:16/10;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;background:
    repeating-linear-gradient(45deg,transparent,transparent 12px,rgba(14,59,42,.045) 12px,rgba(14,59,42,.045) 24px);
  color:var(--faint);text-align:center;padding:24px}
.demo .ph b{font-family:var(--disp);font-size:17px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.demo .ph span{font-size:14px;max-width:40ch}

/* ---------- prezzo ---------- */
.price{margin-top:40px;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:24px}
.price h2{font-family:var(--disp);font-size:24px;font-weight:700;text-transform:uppercase;
  letter-spacing:.6px;margin-bottom:14px}
.tiers{display:grid;gap:16px}
@media (min-width:640px){.tiers{grid-template-columns:1fr 1fr}}
.tier{border:1px solid var(--line);border-radius:12px;padding:18px}
.tier.pro{border-color:var(--gold)}
.tier .amt{font-family:var(--disp);font-size:34px;font-weight:700;line-height:1}
.tier .per{font-size:14px;color:var(--faint);margin-top:2px}
.tier ul{list-style:none;margin:14px 0 0;font-size:15px}
.tier li{position:relative;padding:4px 0 4px 20px;color:var(--muted)}
.tier li::before{content:"✓";position:absolute;left:0;color:var(--green);font-weight:700}
@media (prefers-color-scheme:dark){.tier li::before{color:#8fd0ae}}
.tier .btn{width:100%;margin-top:16px}
.yearly{margin-top:12px;font-size:14px;color:var(--muted);text-align:center}
.yearly a{color:inherit}

/* ---------- piede ---------- */
footer{margin-top:52px;border-top:1px solid var(--line);padding:22px 0 40px;
  font-size:14px;color:var(--faint)}
footer nav{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:10px}
footer a{color:var(--muted)}
[hidden]{display:none!important}
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <a class="brand" href="/"><img src="/app/icons/ebanist-mark-simple.svg" alt=""> Ebanist</a>
    <div class="sp"></div>
    <div class="langs" id="langs">
      <button data-l="ro">RO</button><button data-l="it">IT</button>
      <button data-l="fr">FR</button><button data-l="en">EN</button>
    </div>
  </div>
</header>

<main class="wrap">
  <h1 data-t="h1"></h1>
  <p class="lede" data-t="lede"></p>

  <div class="cta">
    <a class="btn btn-p" id="ctaFree" href="/app/" data-t="ctaFree"></a>
    <a class="btn btn-s" id="ctaPro" href="#pret" data-t="ctaPro"></a>
  </div>
  <p class="note" data-t="noAccount"></p>

  <section class="bens">
    <div class="ben"><span class="n">01</span><h3 data-t="b1t"></h3><p data-t="b1d"></p></div>
    <div class="ben"><span class="n">02</span><h3 data-t="b2t"></h3><p data-t="b2d"></p></div>
    <div class="ben"><span class="n">03</span><h3 data-t="b3t"></h3><p data-t="b3d"></p></div>
  </section>

  <!-- Il filmato di 15 s: rettangolo dichiarato finche non e girato.
       Come sostituirlo sta in MONETIZARE.md. -->
  <section class="demo">
    <div class="ph">
      <b data-t="vidT"></b>
      <span data-t="vidD"></span>
    </div>
  </section>

  <section class="price" id="pret">
    <h2 data-t="priceT"></h2>
    <div class="tiers">
      <div class="tier">
        <div class="amt" data-t="freeAmt"></div>
        <div class="per" data-t="freePer"></div>
        <ul>
          <li data-t="f1"></li><li data-t="f2"></li><li data-t="f3"></li>
        </ul>
        <a class="btn btn-s" href="/app/" data-t="freeBtn"></a>
      </div>
      <div class="tier pro">
        <div class="amt" id="proAmt"></div>
        <div class="per" data-t="proPer"></div>
        <ul>
          <li data-t="p1"></li><li data-t="p2"></li><li data-t="p3"></li><li data-t="p4"></li>
        </ul>
        <a class="btn btn-p" id="buyM" href="/app/?activate=1" data-t="proBtn"></a>
      </div>
    </div>
    <p class="yearly"><a id="buyY" href="/app/?activate=1" data-t="yearly"></a></p>
    <p class="note" data-t="vatNote"></p>
  </section>
</main>

<footer class="wrap">
  <nav>
    <a href="/termeni.html" data-t="lTerms"></a>
    <a href="/privacy.html" data-t="lPrivacy"></a>
    <a href="/rambursare.html" data-t="lRefund"></a>
    <a href="mailto:info@ebanist.com">info@ebanist.com</a>
  </nav>
  <p data-t="foot"></p>
</footer>

<!-- La configurazione dell'incasso e la STESSA dell'app: un file solo, cosi
     il giorno che cambia il negozio non ci sono due posti da aggiornare e uno
     da dimenticare. -->
<script src="/app/config/billing.js"></script>
<script src="/site.js"></script>
</body>
</html>
