plugins { id "com.android.application" }

/* Cheia de semnare NU stă în repo: keystore.properties (ignorat de git)
   indică fișierul și parolele. Vezi android/CITESTE-MA.md. */
def ks = new Properties()
def ksFile = rootProject.file("keystore.properties")
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
    namespace "com.domusrenov.ebanist"
    compileSdk 36

    defaultConfig {
        applicationId "com.domusrenov.ebanist"
        minSdk 24
        targetSdk 36
        /* 1 = TWA-ul din iulie 2026 (PWABuilder). 2 = primul WebView (Android 10+).
           3 = Android 7+: telefoanele vechi de șantier contează.
           4 = abonamentul Pro prin Google Play Billing.
           5 = butonul AR: linkurile intent:// deschise din WebView.
           6 = aplicația pe ebanist.com, cu mutarea datelor de pe adresa veche (L.10).
           7 = cererea de recenzie în Play (In-App Review) și butonul „Evaluează Ebanist" (D-105);
               codul 6 era deja folosit în Play Console, deci același conținut + recenzia pleacă cu 7.
           8 = prima urcare automată prin API (workflow android-aab, D-108), același conținut ca 7. */
        versionCode 9
        versionName "1.4.0"
    }

    signingConfigs {
        release {
            if (ks["storeFile"]) {
                storeFile file(ks["storeFile"])
                storePassword ks["storePassword"]
                keyAlias ks["keyAlias"]
                keyPassword ks["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    buildFeatures { buildConfig true }

    lint { checkReleaseBuilds false }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    /* Abonamentul Pro pe Android trece prin Google Play (regula Play
       pentru bunuri digitale). Aduce cu ea AndroidX și Play Services. */
    implementation "com.android.billingclient:billing:8.3.0"
    /* Cererea de recenzie în aplicație (Play In-App Review): dialogul îl
       desenează Google, aplicația nu iese din ecran. Vezi Bridge.requestReview. */
    implementation "com.google.android.play:review:2.0.2"
}
