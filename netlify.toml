[build]
  # Il sito resta statico: si pubblica la cartella cosi com'e, nessun build.
  # Il comando vuoto e ESPLICITO: con un package.json in giro, senza questo
  # Netlify potrebbe mettersi a cercare uno step di build che non esiste.
  publish = "."
  command = ""
  functions = "netlify/functions"

# La rotta /ar la dichiara la funzione stessa (config.path in model.js).
# Una regola di riscrittura qui NON funziona: il :splat non arriva alla
# query string della funzione, e il GET risponde sempre "id mancante".

[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=0"
