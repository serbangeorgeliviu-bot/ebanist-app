[build]
  # Il sito resta statico: si pubblica la cartella cosi com'e, nessun build.
  # Il comando vuoto e ESPLICITO: con un package.json in giro, senza questo
  # Netlify potrebbe mettersi a cercare uno step di build che non esiste.
  publish = "."
  command = ""
  functions = "netlify/functions"

# La rotta /ar la dichiara la funzione stessa (config.path in model.js).
# Una regola di riscrittura qui NON funziona: il :splat non arriva alla
# query string della funzione, e il GET risponde sempre "id mancante".

# ---------------------------------------------------------------------
# DOMINIO UFFICIALE: ebanist.com (D-41). ebanist.app resta solo come
# redirect e si configura NEL PANNELLO NETLIFY, non qui: si aggiunge come
# "domain alias" del sito, e Netlify manda da solo un 301 al dominio
# primario. Un [[redirects]] non puo farlo — le condizioni di Netlify sono
# Country/Language/Role/Cookie, non l'Host.
#
# Nota sul .app: e un TLD con HSTS preload obbligatorio, quindi il browser
# NON prova nemmeno http://. Il certificato per l'alias lo emette Netlify
# da solo, ma finche non c'e, ebanist.app non risponde affatto — non
# "risponde male": non risponde. Prima si punta il DNS, poi si aspetta il
# certificato.
# ---------------------------------------------------------------------

# ---------------------------------------------------------------------
# ORDER RAIL — il link che il laboratorio da ai suoi clienti.
#
# /a/<slug> e un REDIRECT 302, non una riscrittura 200. Una riscrittura
# servirebbe il contenuto di /app/index.html all'indirizzo /a/demo, ma
# quel file carica tutto con percorsi relativi (./ebanist-core.js): da li
# diventerebbero /a/ebanist-core.js e l'app non partirebbe affatto.
# Il link corto resta quello che si condivide; il browser atterra su
# /app/?atelier=<slug>. Dettagli in DECISIONS.md §2.1.
[[redirects]]
  from = "/a/:slug"
  to = "/app/?atelier=:slug"
  status = 302

# Inbox e pagina d'ordine sono file PROPRI, con percorsi assoluti:
# li la riscrittura 200 funziona, e l'indirizzo resta bello.
[[redirects]]
  from = "/a/:slug/inbox"
  to = "/order-rail/inbox.html"
  status = 200
[[redirects]]
  from = "/a/:slug/order/:id"
  to = "/order-rail/order-view.html"
  status = 200

[[redirects]]
  from = "/api/orders"
  to = "/.netlify/functions/orders"
  status = 200
[[redirects]]
  from = "/api/orders/*"
  to = "/.netlify/functions/orders/:splat"
  status = 200
[[redirects]]
  from = "/api/stats"
  to = "/.netlify/functions/stats"
  status = 200

# ---------------------------------------------------------------------
# L'app si e spostata da "/" a "/app/": in radice adesso c'e la pagina di
# presentazione. Gli indirizzi vecchi devono continuare a funzionare —
# sono nei preferiti, nelle scorciatoie sullo schermo e nella cache dei
# telefoni gia in giro. Stesso ORIGINE, quindi IndexedDB e localStorage
# restano quelli: nessuno perde i progetti in questo trasloco.
#
# 301 e non 302: e un trasloco definitivo, e vogliamo che i browser lo
# imparino invece di richiedere ogni volta.
# ---------------------------------------------------------------------
[[redirects]]
  from = "/index.html"
  to = "/app/"
  status = 301
  force = true

[[redirects]]
  from = "/app"
  to = "/app/"
  status = 301

# I file dell'app chiesti al vecchio indirizzo: capita alle finestre
# aperte da giorni e alle cache a meta. Vanno serviti, non 404.
[[redirects]]
  from = "/ebanist-core.js"
  to = "/app/ebanist-core.js"
  status = 301
[[redirects]]
  from = "/viewer3d.js"
  to = "/app/viewer3d.js"
  status = 301
[[redirects]]
  from = "/geo3d.js"
  to = "/app/geo3d.js"
  status = 301
[[redirects]]
  from = "/arexport.js"
  to = "/app/arexport.js"
  status = 301
[[redirects]]
  from = "/manifest.webmanifest"
  to = "/app/manifest.webmanifest"
  status = 301
[[redirects]]
  from = "/vendor/*"
  to = "/app/vendor/:splat"
  status = 301
[[redirects]]
  from = "/icons/*"
  to = "/app/icons/:splat"
  status = 301

# Il service worker NON si redirige mai. "/sw.js" deve restare servibile
# dalla radice: e l'unico modo di sostituire quello vecchio con quello che
# si disinstalla da solo. Un redirect qui lo lascerebbe vivo per sempre.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/app/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=0"

# Nel localStorage di questa origine stanno la chiave API Anthropic, tutti i
# progetti coi dati dei clienti e il token di sessione Supabase. Gli header
# qui sotto sono l'ultima rete se qualcosa riesce comunque a iniettare codice.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    # la fotocamera serve ad «In camera tua» e il microfono alla dettatura:
    # si concedono a questa origine e si nega tutto il resto.
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=(), payment=(), usb=(), interest-cohort=()"
    # 'unsafe-inline' su script-src resta obbligatorio finche l'app e un unico
    # index.html con tutto il codice dentro: toglierlo vuol dire estrarre 5.000
    # righe in un file a parte, e non e questo il momento.
    # connect-src resta su https: di proposito: l'utente puo configurare un
    # ENDPOINT PROPRIO per l'assistente (Impostazioni → Assistente AI), e una
    # lista chiusa di host lo romperebbe in silenzio. Se un giorno l'endpoint
    # si fissa, stringere qui e la prima cosa da fare.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https:; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
